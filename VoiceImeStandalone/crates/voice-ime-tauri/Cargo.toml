[package]
name = "voice-ime-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "译见pro 独立语音输入法按需工具窗（Tauri 2 + WebView2，关窗即退零常驻内存）"
default-run = "TrueFluentVoiceImeTools"

[lib]
name = "voice_ime_tauri_lib"
path = "src/lib.rs"

[[bin]]
name = "TrueFluentVoiceImeTools"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
voice-ime-config     = { workspace = true }
voice-ime-storage    = { workspace = true }
voice-ime-speech     = { workspace = true }
voice-ime-win32      = { workspace = true }
voice-ime-controller = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }
tokio                = { workspace = true }
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }

# 在 Windows 与 macOS 上启用完整 Tauri 2 WebView 运行时；
# 无头 Linux CI 容器在缺少 webkit2gtk 系统包时仍可通过全量 cargo check / cargo test。
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "2.12.5", features = [] }
